services:
  - type: web
    name: campus-sharing-system
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        value: sqlite:///./campus_sharing.db
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: campus-db
      mountPath: /var/data
      sizeGB: 1
