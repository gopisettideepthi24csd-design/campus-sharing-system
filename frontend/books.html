<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - Campus Sharing System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- ============================================================
         BOOKS PAGE
         Displays all books with search, filter, and request functionality.
         Users can add new books and request to borrow existing ones.
         ============================================================ -->
    
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">🎓 Campus Sharing</div>
        <div class="nav-links">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/books-page" class="nav-link active">Books</a>
            <a href="/resources-page" class="nav-link">Resources</a>
            <a href="/my-requests" class="nav-link">My Requests</a>
            <a href="/received-requests" class="nav-link">Received Requests</a>
        </div>
        <div class="nav-user">
            <span id="user-name">User</span>
            <span id="user-role" class="badge"></span>
            <button class="btn btn-sm btn-outline" onclick="logout()">Logout</button>
        </div>
    </nav>
    
    <div class="container">
        <!-- Page Header with Add Button -->
        <div class="page-header">
            <h1>📚 Books</h1>
            <button class="btn btn-primary" onclick="showAddBookModal()">+ Add Book</button>
        </div>
        
        <!-- Search and Filter Bar -->
        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="Search by title or author..." 
                   oninput="searchBooks()">
            <select id="status-filter" onchange="filterBooks()">
                <option value="">All Status</option>
                <option value="Available">Available</option>
                <option value="Borrowed">Borrowed</option>
            </select>
        </div>
        
        <!-- Books Grid -->
        <div id="books-grid" class="items-grid">
            <p class="text-muted">Loading books...</p>
        </div>
    </div>
    
    <!-- Add Book Modal -->
    <div id="add-book-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Book</h2>
                <button class="modal-close" onclick="closeModal('add-book-modal')">&times;</button>
            </div>
            <form onsubmit="handleAddBook(event)">
                <div class="form-group">
                    <label for="book-title">Title *</label>
                    <input type="text" id="book-title" placeholder="Book title" required>
                </div>
                <div class="form-group">
                    <label for="book-author">Author</label>
                    <input type="text" id="book-author" placeholder="Author name">
                </div>
                <div class="form-group">
                    <label for="book-subject">Subject</label>
                    <input type="text" id="book-subject" placeholder="e.g., Computer Science">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Add Book</button>
            </form>
        </div>
    </div>
    
    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>
    
    <script src="/js/api.js"></script>
    <script src="/js/books.js"></script>
</body>
</html>
