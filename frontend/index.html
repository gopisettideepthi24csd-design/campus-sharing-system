<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Sharing System - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- ============================================================
         LOGIN / REGISTER PAGE
         This is the entry point of the application.
         Users can switch between Login and Register forms.
         ============================================================ -->
    
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">🎓 Campus Sharing System</h1>
            <p class="auth-subtitle">Share Resources, Share Knowledge</p>
            
            <!-- Tab Switcher -->
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="showTab('login')">Login</button>
                <button class="tab-btn" onclick="showTab('register')">Register</button>
            </div>
            
            <!-- Login Form -->
            <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>
            
            <!-- Register Form (hidden by default) -->
            <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="reg-role">Role</label>
                    <select id="reg-role">
                        <option value="student">Student</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Register</button>
            </form>
            
            <!-- Error/Success Messages -->
            <div id="auth-message" class="message hidden"></div>
            
            <!-- Demo Credentials -->
            <div class="demo-info">
                <p><strong>Demo Credentials:</strong></p>
                <p>Admin: admin@campus.edu / admin123</p>
                <p>Student: john@campus.edu / student123</p>
            </div>
        </div>
    </div>
    
    <script src="/js/auth.js"></script>
</body>
</html>
