<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources - Campus Sharing System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- ============================================================
         RESOURCES PAGE
         Displays all shared resources with search, filter, and request.
         Users can add new resources (notes, tools, electronics, etc.)
         ============================================================ -->
    
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">🎓 Campus Sharing</div>
        <div class="nav-links">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/books-page" class="nav-link">Books</a>
            <a href="/resources-page" class="nav-link active">Resources</a>
            <a href="/my-requests" class="nav-link">My Requests</a>
            <a href="/received-requests" class="nav-link">Received Requests</a>
        </div>
        <div class="nav-user">
            <span id="user-name">User</span>
            <span id="user-role" class="badge"></span>
            <button class="btn btn-sm btn-outline" onclick="logout()">Logout</button>
        </div>
    </nav>
    
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <h1>📦 Resources</h1>
            <button class="btn btn-primary" onclick="showAddResourceModal()">+ Add Resource</button>
        </div>
        
        <!-- Search and Filter Bar -->
        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="Search resources..." 
                   oninput="searchResources()">
            <select id="category-filter" onchange="filterResources()">
                <option value="">All Categories</option>
                <option value="Notes">Notes</option>
                <option value="Tools">Tools</option>
                <option value="Electronics">Electronics</option>
                <option value="Stationery">Stationery</option>
                <option value="Other">Other</option>
            </select>
            <select id="status-filter" onchange="filterResources()">
                <option value="">All Status</option>
                <option value="Available">Available</option>
                <option value="Borrowed">Borrowed</option>
            </select>
        </div>
        
        <!-- Resources Grid -->
        <div id="resources-grid" class="items-grid">
            <p class="text-muted">Loading resources...</p>
        </div>
    </div>
    
    <!-- Add Resource Modal -->
    <div id="add-resource-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Resource</h2>
                <button class="modal-close" onclick="closeModal('add-resource-modal')">&times;</button>
            </div>
            <form onsubmit="handleAddResource(event)">
                <div class="form-group">
                    <label for="resource-title">Title *</label>
                    <input type="text" id="resource-title" placeholder="Resource title" required>
                </div>
                <div class="form-group">
                    <label for="resource-description">Description</label>
                    <textarea id="resource-description" placeholder="Describe the resource..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="resource-category">Category *</label>
                    <select id="resource-category" required>
                        <option value="">Select category</option>
                        <option value="Notes">Notes</option>
                        <option value="Tools">Tools</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Stationery">Stationery</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Add Resource</button>
            </form>
        </div>
    </div>
    
    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>
    
    <script src="/js/api.js"></script>
    <script src="/js/resources.js"></script>
</body>
</html>
